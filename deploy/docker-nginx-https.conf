resolver 127.0.0.11 valid=10s;
upstream orbitjoy_api {
 zone orbitjoy_api 64k;
 server app:8000 resolve;
}
server {
 listen 80;
 server_name 18.188.198.49;
 location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
 location / { return 301 https://18.188.198.49$request_uri; }
}
server {
 listen 443 ssl;
 server_name 18.188.198.49;
 ssl_certificate /etc/letsencrypt/live/orbitjoy-ip/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/orbitjoy-ip/privkey.pem;
 ssl_protocols TLSv1.2 TLSv1.3;
 client_max_body_size 6m;
 location / {
  proxy_pass http://orbitjoy_api;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
 }
}
