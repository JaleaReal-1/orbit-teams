# BEGIN ORBIT SOFT
server_names_hash_bucket_size 128;
server {
  listen 80;
  server_name ec2-18-224-68-11.us-east-2.compute.amazonaws.com 18.224.68.11;
  location = /orbit-soft {
    return 308 /orbit-soft/$is_args$args;
  }
  location ^~ /orbit-soft/ {
    # The trailing slash strips the public prefix before reaching the static site.
    proxy_pass http://orbit-soft-web:80/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  # Orbit Joy keeps the public root; its administration stays blocked over HTTP.
  location ^~ /admin { return 403; }
  location / {
    proxy_pass http://orbitjoy_api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
# END ORBIT SOFT
