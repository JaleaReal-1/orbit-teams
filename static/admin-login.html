<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Iniciar sesión · Orbit Joy</title><link rel="stylesheet" href="/static/admin.css?v=2"></head><body class="login-body"><main class="login-layout"><section class="login-form-area"><div class="login-card"><a class="brand" href="/">Orbit Joy</a><h1>Iniciar sesión</h1><p class="muted">Accede al panel de regalos.</p><form method="post" action="/admin/login"><input type="hidden" name="token" value="{{TOKEN}}"><label for="username">Usuario</label><input id="username" name="username" autocomplete="username" required maxlength="100" placeholder="Usuario" autofocus><div class="password-heading"><label for="password">Contraseña</label><button class="text-button" type="button" id="toggle-password" aria-controls="password" aria-pressed="false">Mostrar</button></div><input id="password" name="password" type="password" autocomplete="current-password" required placeholder="Ingresa tu contraseña"><p class="error" role="alert">{{ERROR}}</p><button class="primary login-submit" type="submit">Entrar al panel</button></form><p class="session-note">Tu sesión estará activa durante 8 horas.</p></div><a class="back-link" href="/catalogo.html">← Volver al catálogo</a></section></main><script src="/static/admin.js?v=2" defer></script></body></html>
