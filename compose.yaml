name: orbit-soft
services:
  web:
    build: .
    image: orbit-soft-web:${RELEASE_COMMIT:-local}
    restart: unless-stopped
    ports:
      - '80:80'
    networks:
      public:
        aliases:
          - orbit-soft-web
    security_opt:
      - no-new-privileges:true
networks:
  public:
    name: orbit-soft-public
