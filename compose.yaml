name: orbitjoy
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: sqlite:////app/data/orbitjoy.db
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      WHATSAPP_NUMBER: ${WHATSAPP_NUMBER:-51978371277}
      UPLOAD_MAX_BYTES: 3145728
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost}
    volumes:
      - ./data:/app/data
      - ./static/uploads:/app/static/uploads
    ports:
      - "127.0.0.1:8001:8000"
  web:
    image: nginx:stable-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./deploy/docker-nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./acme:/var/www/certbot:ro
